[project]
name = "enterprise-multi-agent-ai"
version = "1.0.0"
description = "LangGraph host with A2A, Agno, and MCP remote agents"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk==1.1.2",
  "agno==3.0.1",
  "fastapi==0.141.1",
  "google-genai==2.20.0",
  "httpx==0.28.1",
  "langgraph==1.2.11",
  "mcp==1.29.1",
  "python-dotenv==1.2.3",
  "uvicorn[standard]==0.52.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
